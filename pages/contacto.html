<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Cookielicious</title>
    
    <!-- Enlace de las fuentes de Google -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <!-- Header -->
    <header class="main-header">
        <a href="../index.html" class="logo-link">
            <img src="../imagenes/Logo.png" alt="Logo de Cookielicious" class="nav-logo-img">
        </a>

        <nav class="main-nav">
            <ul class="nav-links">
                <li><a href="../index.html#inicio">Inicio</a></li>
                <li><a href="cookies.html">Nuestras Cookies</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>


    <main>
        <section class="contact-section">
            <h2>Contacto</h2>
            <p>Escríbenos y nos pondremos en contacto lo antes posible.</p>

            <!-- Formulario conectado aFORMSPREE -->
            <form action="https://formspree.io/f/mvkzkqkp" method="POST" class="contact-form">
                
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="name" required placeholder="Tu nombre completo">
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="_replyto" required placeholder="tu@email.com">
                </div>

                <div class="form-group">
                    <label for="asunto">Asunto del mensaje:</label>
                    <select id="asunto" name="subject" required>
                        <option value="" disabled selected>Selecciona una opción...</option>
                        <option value="Compra">Compra</option>
                        <option value="Compra para reventa">Compra para reventa</option>
                        <option value="Reclamo">Reclamo</option>
                        <option value="Sugerencias">Sugerencias</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="message" rows="5" required placeholder="Escribe tu mensaje aquí..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <p>&copy; 2026 Cookielicious Bakery Artesanal. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
